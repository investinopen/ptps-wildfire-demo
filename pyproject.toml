[project]
name = "ptps-wildfire-demo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "Aidan Feldman", email = "aidan.feldman@gmail.com" }]
requires-python = ">=3.11"
dependencies = [
    "dask>=2026.7.1",
    "duckdb>=1.5.5",
    "geopandas>=1.1.4",
    "httpx>=0.28.1",
    "icechunk>=1.1.21",
    "ipykernel>=7.3.0",
    "jupysql>=0.11.1",
    "lonboard>=0.16.0",
    "matplotlib>=3.11.1",
    "mitmproxy>=11.0.2",
    "pandas-stubs>=3.0.5.260730",
    "pyarrow>=25.0.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "python-dotenv>=1.2.3",
    "pytz>=2026.3.post1",
    "toml>=0.10.2",               # for JupySQL
    "xarray>=2026.7.0",
]

[tool.pytest.ini_options]
# https://pytest-asyncio.readthedocs.io/en/stable/concepts.html#test-discovery-modes
asyncio_mode = "auto"
pythonpath = ["."]
