<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Detailed firefighter map</title>
    <!-- where the detailed firefighter map used to be; the script keeps the #zoom/lat/lng of an old link, and the meta refresh covers browsers without JavaScript -->
    <meta http-equiv="refresh" content="0; url=../firefighter-maps/detailed/" />
    <link rel="canonical" href="../firefighter-maps/detailed/" />
    <script>
      location.replace("../firefighter-maps/detailed/" + location.hash);
    </script>
  </head>
  <body>
    <p>
      The firefighter map has moved to
      <a href="../firefighter-maps/detailed/">firefighter-maps/detailed/</a>.
    </p>
  </body>
</html>
