<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Firefighter map</title>
    <link
      href="https://cdn.jsdelivr.net/npm/maplibre-gl@5/dist/maplibre-gl.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5/dist/maplibre-gl.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pmtiles@4/dist/pmtiles.js"></script>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        display: flex;
        flex-direction: column;
      }
      /* links to the rest of the site (see ../_quarto.yml) -- the map isn't rendered by
         Quarto, so this stands in for its navbar, matching the theme's colors */
      #site-nav {
        flex: none;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 4px 16px;
        background: #000000;
        padding: 8px 12px;
        font: 15px/1.4 Inter, sans-serif;
      }
      #site-nav a {
        color: rgba(255, 255, 255, 0.8);
        text-decoration: none;
      }
      #site-nav a:hover,
      #site-nav a[aria-current] {
        color: #ffde17;
      }
      #site-nav .site-title {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-right: 8px;
        color: #ffffff;
        font-size: 17px;
      }
      /* same as theme.scss: the logo's paths are black with no fill of their own */
      #site-nav .site-title img {
        height: 36px;
        filter: invert(1);
      }
      #disclaimer-banner {
        flex: none;
        background: #fff3cd;
        color: #664d03;
        border-bottom: 1px solid #ffe69c;
        padding: 6px 12px;
        font: 13px/1.4 sans-serif;
        text-align: center;
      }
      #map-container {
        position: relative;
        flex: 1;
        min-height: 0;
      }
      #map {
        width: 100%;
        height: 100%;
      }

      @media print {
        @page {
          size: landscape;
          margin: 0.4in;
        }
        /* #map isn't forced to 100vh here -- it already fills whatever's left below the
           banner via the flex layout below; hardcoding it on top of that overflowed the
           page by the banner's own height */
        html,
        body {
          height: 100vh;
          width: 100vw;
        }
        /* the yellow background/border read as a screen warning color; on paper, plain
           black text is more legible and doesn't rely on background-graphics being on */
        #disclaimer-banner {
          color: #000000;
          border-bottom: none;
        }
        /* zoom buttons are meaningless on paper; the compass sits in the same top-right
           group (see the NavigationControl call below) and stays put, so only the
           zoom-in/out buttons are targeted here rather than hiding the whole corner */
        .maplibregl-ctrl-top-right .maplibregl-ctrl-zoom-in,
        .maplibregl-ctrl-top-right .maplibregl-ctrl-zoom-out {
          display: none !important;
        }
        /* geolocate and full screen are each their own group (no "you are here" or full
           screen on a printed page); unlike zoom each is the only button in its box, so
           hiding the whole group (not just the button) avoids leaving an empty bordered
           square behind */
        .maplibregl-ctrl-top-right
          .maplibregl-ctrl-group:has(.maplibregl-ctrl-geolocate),
        .maplibregl-ctrl-top-right
          .maplibregl-ctrl-group:has(.maplibregl-ctrl-fullscreen) {
          display: none !important;
        }
        /* the compass's arrow is a background-image, which browsers drop when "print
           backgrounds" is off unless told otherwise -- same issue as the legend swatches
           below, just on a control the library styles rather than one of ours */
        .maplibregl-ctrl-icon,
        .maplibregl-ctrl-group {
          print-color-adjust: exact;
          -webkit-print-color-adjust: exact;
        }
        /* the attribution control is a <details>/<summary> toggle; the summary is already
           hidden on screen (compact:false skips it), but print rendering brings back its
           native disclosure marker (the arrow) and the space it reserves -- kill it explicitly */
        .maplibregl-ctrl-attrib-button {
          display: none !important;
        }
        .maplibregl-ctrl-attrib-button::-webkit-details-marker {
          display: none !important;
        }
        .maplibregl-ctrl-attrib-button::marker {
          content: "" !important;
        }
        /* the toggle can't be clicked on paper, but the swatch + label still work as a legend key */
        #layer-controls input[type="checkbox"] {
          display: none;
        }
        /* a search box (or site navigation) is meaningless on paper */
        #site-nav,
        #place-search {
          display: none;
        }
      }

      /* wraps the spinner + legend so their left-to-right order can be changed in markup
         without hand-tuning offsets -- the legend's width isn't fixed, so positioning the
         spinner after it with a hardcoded `left` would break whenever the legend's content
         (and so its rendered width) changes */
      #top-left-controls {
        position: absolute;
        top: 12px;
        left: 12px;
        z-index: 1;
        display: flex;
        align-items: flex-start;
        gap: 10px;
      }
      #live-data-spinner {
        flex: none;
        width: 22px;
        height: 22px;
        border: 3px solid #ffffff;
        border-top-color: #e0342a;
        border-radius: 50%;
        box-shadow: 0 0 2px rgba(0, 0, 0, 0.4);
        animation: live-data-spin 0.8s linear infinite;
      }
      #live-data-spinner[hidden] {
        display: none;
      }
      @keyframes live-data-spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* in normal document flow (like the disclaimer banner) rather than floated over the
         map, so it can't collide with the legend at narrow widths */
      #place-search {
        flex: none;
        padding: 8px 12px;
        background: #f5f5f5;
        border-bottom: 1px solid rgba(0, 0, 0, 0.15);
      }
      #place-search input {
        width: 100%;
        max-width: 320px;
        box-sizing: border-box;
        padding: 6px 10px;
        border: 1px solid rgba(0, 0, 0, 0.2);
        border-radius: 4px;
        font: 13px sans-serif;
      }

      /* the non-compact attribution list has no width of its own -- it only avoids the
         scale bar in the opposite corner because there's normally enough window width for
         it to lay out on one line. Once it wraps (a narrow window, or a print page cut down
         to fit), it grows to fill the entire bottom edge and swallows the scale bar. Capping
         it forces the wrap to happen before it reaches that corner, and the leftover z-index
         keeps the corner above the attribution's own translucent background as a fallback */
      .maplibregl-ctrl-bottom-right {
        max-width: calc(100% - 160px);
      }
      .maplibregl-ctrl-bottom-left {
        z-index: 3;
      }

      #layer-controls {
        flex: none;
        background: #ffffff;
        border-radius: 4px;
        box-shadow: 0 0 2px rgba(0, 0, 0, 0.4);
        padding: 6px 10px;
        font: 13px/1.4 sans-serif;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      #layer-controls label {
        display: flex;
        align-items: center;
        gap: 5px;
        white-space: nowrap;
      }
      #layer-controls .swatch {
        width: 16px;
        height: 16px;
        border: 1px solid rgba(0, 0, 0, 0.2);
        flex: none;
        /* browsers drop background colors/gradients when printing unless told otherwise,
           which left these blank -- they're the whole point of a legend */
        print-color-adjust: exact;
        -webkit-print-color-adjust: exact;
      }
      /* matches the low-to-high stops of the image service's own color ramp */
      #layer-controls .swatch.burn-probability {
        background: linear-gradient(135deg, #fff0cf, #fc8d59, #7f0000);
      }
      /* matches the low-to-high stops of RISK_BINS below */
      #layer-controls .swatch.buildings {
        background: linear-gradient(135deg, #fee2d5, #fb7c5c, #67000d);
        border-color: #4d4d4d;
      }
      /* a small colorbar under the buildings row: the zero-risk gray on its own, then one
         cell per risk bin, labeled at the boundaries between them. Laid out on a fixed
         cell width so the tick labels (absolutely positioned) line up with the edges */
      #building-risk-key {
        --cell-width: 20px;
        margin: 0 0 4px 21px;
        font-size: 10px;
        line-height: 1.2;
        /* same reason as the swatches -- the cells are nothing but background colors */
        print-color-adjust: exact;
        -webkit-print-color-adjust: exact;
      }
      /* no key for a layer that isn't shown, on screen or on paper */
      #layer-controls label:has(input:not(:checked)) + .layer-key {
        display: none;
      }
      #building-risk-key .cells {
        display: flex;
        border: 1px solid #4d4d4d;
        width: max-content;
      }
      #building-risk-key .cells span {
        width: var(--cell-width);
        height: 10px;
      }
      /* sets the zero-risk gray apart from the scale itself */
      #building-risk-key .cells span:first-child {
        margin-right: 3px;
        border-right: 1px solid #4d4d4d;
      }
      #building-risk-key .ticks {
        position: relative;
        height: 12px;
      }
      #building-risk-key .ticks span {
        position: absolute;
        transform: translateX(-50%);
        white-space: nowrap;
      }
      #building-risk-key .caption {
        color: #444444;
      }
      /* matches FLAME_LENGTH_CLASSES below */
      /* the middle (orange) class's hatch -- see hatchCss in rasters.js (9.9px is
         HATCH_SIZE / sqrt(2)) */
      #layer-controls .swatch.flame-length {
        background:
          repeating-linear-gradient(
            -45deg,
            rgb(240, 120, 0) 0 1.5px,
            transparent 1.5px 9.9px
          ),
          #ffffff;
      }
      /* one row per class: its color + what that flame length means for attack */
      #flame-length-key {
        margin: 0 0 4px 21px;
        font-size: 10px;
        line-height: 1.2;
        display: grid;
        grid-template-columns: auto auto 1fr;
        gap: 2px 5px;
        align-items: center;
        print-color-adjust: exact;
        -webkit-print-color-adjust: exact;
      }
      /* big enough to show a few repeats of the hatch, so it reads as a pattern */
      #flame-length-key .cell {
        width: 32px;
        height: 16px;
        border: 1px solid #4d4d4d;
      }
      #flame-length-key .range {
        font-weight: bold;
        white-space: nowrap;
      }
      #layer-controls .swatch.roads {
        background: #2b2b2b;
      }
      #layer-controls .swatch.driveways {
        background: #6a2fb8;
      }
      #layer-controls .swatch.trails {
        background: #6b8e23;
      }
      #layer-controls .swatch.hillshade {
        background: linear-gradient(135deg, #ffffff, #6b6b6b);
      }
      /* symbols drawn in icons.js -- see buildLegendKeys in legend.js */
      #layer-controls .swatch.icon {
        border: none;
        background-size: contain;
        background-repeat: no-repeat;
        background-position: center;
      }
      /* stands in for the boxed limit shown on the bridge itself */
      #layer-controls .swatch.weight-limit {
        box-sizing: border-box;
        background: #ffffff;
        border-color: #000000;
        font: bold 10px/14px sans-serif;
        text-align: center;
      }
      #layer-controls .swatch.hydrants {
        background: #e0342a;
        border-radius: 50%;
      }
      #layer-controls .swatch.water-sources {
        background: #1f5fa8;
        border-radius: 50%;
      }
      /* smaller than the other point swatches, same as the pools on the map */
      #layer-controls .swatch.pools {
        background: #6baed6;
        border-radius: 50%;
        width: 10px;
        height: 10px;
        margin: 3px;
      }
    </style>
  </head>
  <body>
    <nav id="site-nav">
      <a class="site-title" href="../"
        ><img src="../img/ioi-logo-dark.svg" alt="Invest in Open Infrastructure" />PtPS
        Wildfire Demo</a
      >
      <a href="../rescue-status.html">Dataset rescue statuses</a>
      <a href="../risk.html">Risk calculation</a>
      <a href="../fire-overlap.html">Wildfire overlap</a>
      <a href="./" aria-current="page">Firefighter map</a>
    </nav>
    <div id="disclaimer-banner">
      This is a map that's meant to be printed out for use by small/rural fire
      departments. It's a proof of concept and hasn't been validated;
      <strong>use at your own risk</strong>.
    </div>
    <form id="place-search" autocomplete="off">
      <input
        type="search"
        id="place-search-input"
        placeholder="Search for a place…"
      />
    </form>
    <div id="map-container">
      <div id="map"></div>
      <div id="top-left-controls">
        <div id="layer-controls">
          <label>
            <input type="checkbox" id="hillshade-toggle" checked />
            <span class="swatch hillshade"></span>
            Topographic shading
          </label>
          <label>
            <input type="checkbox" id="flame-length-toggle" checked />
            <span class="swatch flame-length"></span>
            Flame length, if a fire starts
          </label>
          <!-- filled in from FLAME_LENGTH_CLASSES below -->
          <div id="flame-length-key" class="layer-key"></div>
          <label>
            <input type="checkbox" id="burn-probability-toggle" />
            <span class="swatch burn-probability"></span>
            Burn probability
          </label>
          <label>
            <input type="checkbox" id="buildings-toggle" checked />
            <span class="swatch buildings"></span>
            Buildings, by wildfire risk
          </label>
          <!-- filled in from RISK_BINS below -->
          <div id="building-risk-key" class="layer-key">
            <div class="cells"></div>
            <div class="ticks"></div>
            <div class="caption">Annual risk to structures (%)</div>
          </div>
          <label>
            <input type="checkbox" id="roads-toggle" checked />
            <span class="swatch roads"></span>
            Roads
          </label>
          <label>
            <input type="checkbox" id="driveways-toggle" checked />
            <span class="swatch driveways"></span>
            Driveways & service roads
          </label>
          <label>
            <input type="checkbox" id="trails-toggle" checked />
            <span class="swatch trails"></span>
            Sidewalks, paths, & trails
          </label>
          <label>
            <input type="checkbox" id="gates-toggle" checked />
            <span class="swatch icon" data-icon="gate"></span>
            Gates & barriers
          </label>
          <label>
            <input type="checkbox" id="dead-ends-toggle" checked />
            <span class="swatch icon" data-icon="dead-end"></span>
            Dead ends, no turnaround mapped
          </label>
          <label>
            <input type="checkbox" id="weight-limits-toggle" checked />
            <span class="swatch weight-limit">t</span>
            Bridge weight limits
          </label>
          <label>
            <input type="checkbox" id="hydrants-toggle" checked />
            <span class="swatch hydrants"></span>
            Fire hydrants
          </label>
          <label>
            <input type="checkbox" id="water-sources-toggle" checked />
            <span class="swatch water-sources"></span>
            Water tanks, ponds, & suction points
          </label>
          <label>
            <input type="checkbox" id="pools-toggle" checked />
            <span class="swatch pools"></span>
            Swimming pools
          </label>
        </div>
        <div
          id="live-data-spinner"
          title="Loading water sources & road access…"
          hidden
        ></div>
      </div>
    </div>
    <script type="module" src="main.js"></script>
  </body>
</html>
