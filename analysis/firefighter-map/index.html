<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Firefighter map</title>
    <link
      href="https://cdn.jsdelivr.net/npm/maplibre-gl@5/dist/maplibre-gl.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5/dist/maplibre-gl.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pmtiles@4/dist/pmtiles.js"></script>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        display: flex;
        flex-direction: column;
      }
      /* links to the rest of the site (see ../_quarto.yml) -- the map isn't rendered by
         Quarto, so this stands in for its navbar, matching the theme's colors */
      #site-nav {
        flex: none;
        display: flex;
        flex-wrap: wrap;
        gap: 4px 16px;
        background: #f8f9fa;
        border-bottom: 1px solid rgba(0, 0, 0, 0.1);
        padding: 8px 12px;
        font: 15px/1.4 sans-serif;
      }
      #site-nav a {
        color: #545555;
        text-decoration: none;
      }
      #site-nav a:hover,
      #site-nav a[aria-current] {
        color: #1f4eb6;
      }
      #site-nav .site-title {
        margin-right: 8px;
        font-size: 17px;
      }
      #disclaimer-banner {
        flex: none;
        background: #fff3cd;
        color: #664d03;
        border-bottom: 1px solid #ffe69c;
        padding: 6px 12px;
        font: 13px/1.4 sans-serif;
        text-align: center;
      }
      #map-container {
        position: relative;
        flex: 1;
        min-height: 0;
      }
      #map {
        width: 100%;
        height: 100%;
      }

      @media print {
        @page {
          size: landscape;
          margin: 0.4in;
        }
        /* #map isn't forced to 100vh here -- it already fills whatever's left below the
           banner via the flex layout below; hardcoding it on top of that overflowed the
           page by the banner's own height */
        html,
        body {
          height: 100vh;
          width: 100vw;
        }
        /* the yellow background/border read as a screen warning color; on paper, plain
           black text is more legible and doesn't rely on background-graphics being on */
        #disclaimer-banner {
          color: #000000;
          border-bottom: none;
        }
        /* zoom buttons are meaningless on paper; the compass sits in the same top-right
           group (see the NavigationControl call below) and stays put, so only the
           zoom-in/out buttons are targeted here rather than hiding the whole corner */
        .maplibregl-ctrl-top-right .maplibregl-ctrl-zoom-in,
        .maplibregl-ctrl-top-right .maplibregl-ctrl-zoom-out {
          display: none !important;
        }
        /* geolocate is its own group (no "you are here" on a printed page); unlike zoom
           it's the only button in its box, so hiding the whole group (not just the button)
           avoids leaving an empty bordered square behind */
        .maplibregl-ctrl-top-right
          .maplibregl-ctrl-group:has(.maplibregl-ctrl-geolocate) {
          display: none !important;
        }
        /* the compass's arrow is a background-image, which browsers drop when "print
           backgrounds" is off unless told otherwise -- same issue as the legend swatches
           below, just on a control the library styles rather than one of ours */
        .maplibregl-ctrl-icon,
        .maplibregl-ctrl-group {
          print-color-adjust: exact;
          -webkit-print-color-adjust: exact;
        }
        /* the attribution control is a <details>/<summary> toggle; the summary is already
           hidden on screen (compact:false skips it), but print rendering brings back its
           native disclosure marker (the arrow) and the space it reserves -- kill it explicitly */
        .maplibregl-ctrl-attrib-button {
          display: none !important;
        }
        .maplibregl-ctrl-attrib-button::-webkit-details-marker {
          display: none !important;
        }
        .maplibregl-ctrl-attrib-button::marker {
          content: "" !important;
        }
        /* the toggle can't be clicked on paper, but the swatch + label still work as a legend key */
        #layer-controls input[type="checkbox"] {
          display: none;
        }
        /* a search box (or site navigation) is meaningless on paper */
        #site-nav,
        #place-search {
          display: none;
        }
      }

      /* wraps the spinner + legend so their left-to-right order can be changed in markup
         without hand-tuning offsets -- the legend's width isn't fixed, so positioning the
         spinner after it with a hardcoded `left` would break whenever the legend's content
         (and so its rendered width) changes */
      #top-left-controls {
        position: absolute;
        top: 12px;
        left: 12px;
        z-index: 1;
        display: flex;
        align-items: flex-start;
        gap: 10px;
      }
      #hydrant-spinner {
        flex: none;
        width: 22px;
        height: 22px;
        border: 3px solid #ffffff;
        border-top-color: #e0342a;
        border-radius: 50%;
        box-shadow: 0 0 2px rgba(0, 0, 0, 0.4);
        animation: hydrant-spin 0.8s linear infinite;
      }
      #hydrant-spinner[hidden] {
        display: none;
      }
      @keyframes hydrant-spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* in normal document flow (like the disclaimer banner) rather than floated over the
         map, so it can't collide with the legend at narrow widths */
      #place-search {
        flex: none;
        padding: 8px 12px;
        background: #f5f5f5;
        border-bottom: 1px solid rgba(0, 0, 0, 0.15);
      }
      #place-search input {
        width: 100%;
        max-width: 320px;
        box-sizing: border-box;
        padding: 6px 10px;
        border: 1px solid rgba(0, 0, 0, 0.2);
        border-radius: 4px;
        font: 13px sans-serif;
      }

      /* the non-compact attribution list has no width of its own -- it only avoids the
         scale bar in the opposite corner because there's normally enough window width for
         it to lay out on one line. Once it wraps (a narrow window, or a print page cut down
         to fit), it grows to fill the entire bottom edge and swallows the scale bar. Capping
         it forces the wrap to happen before it reaches that corner, and the leftover z-index
         keeps the corner above the attribution's own translucent background as a fallback */
      .maplibregl-ctrl-bottom-right {
        max-width: calc(100% - 160px);
      }
      .maplibregl-ctrl-bottom-left {
        z-index: 3;
      }

      #layer-controls {
        flex: none;
        background: #ffffff;
        border-radius: 4px;
        box-shadow: 0 0 2px rgba(0, 0, 0, 0.4);
        padding: 6px 10px;
        font: 13px/1.4 sans-serif;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      #layer-controls label {
        display: flex;
        align-items: center;
        gap: 5px;
        white-space: nowrap;
      }
      #layer-controls .swatch {
        width: 16px;
        height: 16px;
        border: 1px solid rgba(0, 0, 0, 0.2);
        flex: none;
        /* browsers drop background colors/gradients when printing unless told otherwise,
           which left these blank -- they're the whole point of a legend */
        print-color-adjust: exact;
        -webkit-print-color-adjust: exact;
      }
      #layer-controls .swatch.hatch {
        background:
          repeating-linear-gradient(
            135deg,
            #d62828,
            #d62828 0.6px,
            transparent 0.6px,
            transparent 6px
          ),
          #ffffff;
      }
      /* matches the low-to-high stops of the image service's own color ramp */
      #layer-controls .swatch.burn-probability {
        background: linear-gradient(135deg, #fff0cf, #fc8d59, #7f0000);
      }
      #layer-controls .swatch.buildings {
        background: #3fb1ce;
        border-color: #1f7a8c;
      }
      #layer-controls .swatch.roads {
        background: #e58a1f;
      }
      #layer-controls .swatch.driveways {
        background: #8855c8;
      }
      #layer-controls .swatch.trails {
        background: #6b8e23;
      }
      #layer-controls .swatch.hillshade {
        background: linear-gradient(135deg, #ffffff, #6b6b6b);
      }
      #layer-controls .swatch.hydrants {
        background: #e0342a;
        border-radius: 50%;
      }
    </style>
  </head>
  <body>
    <nav id="site-nav">
      <a class="site-title" href="../">PtPS Wildfire Demo</a>
      <a href="../">Dataset rescue statuses</a>
      <a href="../risk.html">Risk calculation</a>
      <a href="./" aria-current="page">Firefighter map</a>
    </nav>
    <div id="disclaimer-banner">
      This is a map that's meant to be printed out for use by small/rural fire
      departments. It's a proof of concept and hasn't been validated;
      <strong>use at your own risk</strong>.
    </div>
    <form id="place-search" autocomplete="off">
      <input
        type="search"
        id="place-search-input"
        placeholder="Search for a place…"
      />
    </form>
    <div id="map-container">
      <div id="map"></div>
      <div id="top-left-controls">
        <div id="layer-controls">
          <label>
            <input type="checkbox" id="hillshade-toggle" checked />
            <span class="swatch hillshade"></span>
            Topographic shading
          </label>
          <label>
            <input type="checkbox" id="fuel-model-toggle" checked />
            <span class="swatch hatch"></span>
            Moderate/high fuel load
          </label>
          <label>
            <input type="checkbox" id="burn-probability-toggle" checked />
            <span class="swatch burn-probability"></span>
            Burn probability
          </label>
          <label>
            <input type="checkbox" id="buildings-toggle" checked />
            <span class="swatch buildings"></span>
            Buildings
          </label>
          <label>
            <input type="checkbox" id="roads-toggle" checked />
            <span class="swatch roads"></span>
            Roads
          </label>
          <label>
            <input type="checkbox" id="driveways-toggle" checked />
            <span class="swatch driveways"></span>
            Driveways & service roads
          </label>
          <label>
            <input type="checkbox" id="trails-toggle" checked />
            <span class="swatch trails"></span>
            Sidewalks, paths, & trails
          </label>
          <label>
            <input type="checkbox" id="hydrants-toggle" checked />
            <span class="swatch hydrants"></span>
            Fire hydrants
          </label>
        </div>
        <div id="hydrant-spinner" title="Loading fire hydrants…" hidden></div>
      </div>
    </div>
    <script>
      // Vector tile archive of merged Google V3 / Microsoft / OSM building footprints,
      // from https://beta.source.coop/repositories/vida/google-microsoft-osm-open-buildings/
      // Same source + view as:
      // https://pmtiles.io/#url=https://data.source.coop/vida/google-microsoft-osm-open-buildings/pmtiles/goog_msft_osm.pmtiles&map=16.03/40.052187/-105.375925
      const PMTILES_URL =
        "https://data.source.coop/vida/google-microsoft-osm-open-buildings/pmtiles/goog_msft_osm.pmtiles";
      const SOURCE_LAYER = "goog_msft_osm_building_footprints";
      const CENTER = [-105.375925, 40.052187]; // [lon, lat]
      const ZOOM = 16.03;
      const BUILDING_MIN_ZOOM = 14.5;
      // Scott & Burgan 40 fire behavior fuel models, from LANDFIRE (USGS/USFS, public domain)
      const FUEL_MODEL_SERVICE_URL =
        "https://edcintl.cr.usgs.gov/arcgis/rest/services/Landfire_LF2025/LF2025_FBFM40_CONUS/ImageServer";
      // the raster's underlying pixel values for each code (LANDFIRE's standard FBFM40
      // numbering: 9x nonburnable, 1xx grass, 12x grass-shrub, 14x shrub, 16x
      // timber-understory, 18x timber-litter, 20x slash-blowdown), spot-checked against
      // live /identify calls at a few points
      const FUEL_MODEL_VALUES = {
        NB1: 91,
        NB2: 92,
        NB3: 93,
        NB8: 98,
        NB9: 99,
        GR1: 101,
        GR2: 102,
        GR3: 103,
        GR4: 104,
        GR5: 105,
        GR6: 106,
        GR7: 107,
        GR8: 108,
        GS1: 121,
        GS2: 122,
        GS3: 123,
        GS4: 124,
        SH1: 141,
        SH2: 142,
        SH3: 143,
        SH4: 144,
        SH5: 145,
        SH6: 146,
        SH7: 147,
        SH8: 148,
        SH9: 149,
        TU1: 161,
        TU2: 162,
        TU3: 163,
        TU4: 164,
        TU5: 165,
        TL1: 181,
        TL2: 182,
        TL3: 183,
        TL4: 184,
        TL5: 185,
        TL6: 186,
        TL7: 187,
        TL8: 188,
        TL9: 189,
        SB1: 201,
        SB2: 202,
        SB3: 203,
        SB4: 204,
      };

      // fire spreads faster and burns more intensely with more fuel, so we use the load
      // LANDFIRE's own model names call out ("low"/"moderate"/"high"/"very high") as a
      // stand-in for risk -- nonburnable and low/sparse-load models are left out; a few
      // models with no load word in their name (TU4, TL4, TL7, TL8) are judgment calls
      // based on what they describe
      const MODERATE_HIGH_RISK_CODES = [
        "GR4",
        "GR6",
        "GR7",
        "GR8",
        "GS2",
        "GS3",
        "GS4",
        "SH2",
        "SH3",
        "SH5",
        "SH7",
        "SH8",
        "SH9",
        "TU2",
        "TU3",
        "TU4",
        "TU5",
        "TL3",
        "TL5",
        "TL6",
        "TL7",
        "TL8",
        "TL9",
        "SB2",
        "SB3",
        "SB4",
      ];

      // every included code maps to the same opaque red -- we only need the colormap to
      // decide what's transparent (the mask below replaces the actual fill), so there's no
      // reason to carry a distinct color per fuel type anymore
      const FUEL_MODEL_COLORMAP = JSON.stringify({
        rasterFunction: "Colormap",
        rasterFunctionArguments: {
          colormap: MODERATE_HIGH_RISK_CODES.map((code) => [
            FUEL_MODEL_VALUES[code],
            255,
            0,
            0,
          ]),
        },
      });

      const FUEL_MODEL_EXPORT_URL =
        FUEL_MODEL_SERVICE_URL +
        "/exportImage?bbox={bbox-epsg-3857}&bboxSR=3857&imageSR=3857&size=256,256&format=png32" +
        "&interpolation=RSP_NearestNeighbor&renderingRule=" +
        encodeURIComponent(FUEL_MODEL_COLORMAP) +
        "&f=image";

      // an 12px tile of thin diagonal lines, repeated to fill the risk mask below
      const HATCH_SIZE = 12;
      const makeHatchTile = () => {
        const patternCanvas = new OffscreenCanvas(HATCH_SIZE, HATCH_SIZE);
        const pctx = patternCanvas.getContext("2d");
        pctx.strokeStyle = "#d62828";
        pctx.lineWidth = 0.6;
        for (const offset of [-HATCH_SIZE, 0, HATCH_SIZE]) {
          pctx.beginPath();
          pctx.moveTo(offset, HATCH_SIZE);
          pctx.lineTo(offset + HATCH_SIZE, 0);
          pctx.stroke();
        }
        return patternCanvas;
      };
      const hatchTile = makeHatchTile();

      // annual burn probability, from USFS Wildfire Risk to Communities (Rocky Mountain
      // Research Station / Pyrologix, public domain):
      // https://data-usfs.hub.arcgis.com/datasets/usfs::wildfire-risk-to-communities-burn-probability-image-service/about
      const BURN_PROBABILITY_SERVICE_URL =
        "https://imagery.geoplatform.gov/iipp/rest/services/Fire_Aviation/USFS_EDW_RMRS_WRC_BurnProbability/ImageServer";
      // "BurnProbability2024" is the service's own named raster function template -- it's
      // what the service already renders by default, but naming it explicitly means we keep
      // getting USFS's classification+color ramp even if that default ever changes
      const BURN_PROBABILITY_RENDERING_RULE = JSON.stringify({
        rasterFunction: "BurnProbability2024",
      });

      const BURN_PROBABILITY_EXPORT_URL =
        BURN_PROBABILITY_SERVICE_URL +
        "/exportImage?bbox={bbox-epsg-3857}&bboxSR=3857&imageSR=3857&size=256,256&format=png32" +
        "&interpolation=RSP_NearestNeighbor&renderingRule=" +
        encodeURIComponent(BURN_PROBABILITY_RENDERING_RULE) +
        "&f=image";

      // a small right-pointing arrow, registered as a map image below -- line-placed symbols
      // orient a 0deg icon along the line's own direction, so "right" is the convention
      const makeArrowIcon = () => {
        const size = 14;
        const canvas = new OffscreenCanvas(size, size);
        const ctx = canvas.getContext("2d");
        ctx.fillStyle = "#ffffff";
        ctx.strokeStyle = "#5c3a00";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(2, 2);
        ctx.lineTo(size - 2, size / 2);
        ctx.lineTo(2, size - 2);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        return ctx.getImageData(0, 0, size, size);
      };

      const protocol = new pmtiles.Protocol();
      maplibregl.addProtocol("pmtiles", protocol.tile);

      // wraps the LANDFIRE tile fetch: keeps the colormap's opacity as a mask of where
      // moderate/high risk fuels are, but swaps its fill for the diagonal hatch instead of a
      // solid color, since risk areas should read as "hazard" rather than "this color means
      // this fuel type" -- registered as a protocol the same way pmtiles:// is above
      maplibregl.addProtocol("fuelhatch", async (params) => {
        const url = params.url.replace("fuelhatch://", "");
        const response = await fetch(url);
        const bitmap = await createImageBitmap(await response.blob());
        const canvas = new OffscreenCanvas(bitmap.width, bitmap.height);
        const ctx = canvas.getContext("2d");

        // each tile draws the hatch starting from its own local (0,0), so without this the
        // lines jump out of phase at every tile edge -- shift the pattern by this tile's
        // real-world position (mod the tile size) so it reads as one continuous hatch
        const [, xmin, , xmax, ymax] = url
          .match(/bbox=(-?[\d.]+),(-?[\d.]+),(-?[\d.]+),(-?[\d.]+)/)
          .map(Number);
        const metersPerPixel = (xmax - xmin) / bitmap.width;
        const mod = (n, m) => ((n % m) + m) % m;
        const offsetX = mod(-xmin / metersPerPixel, HATCH_SIZE);
        const offsetY = mod(ymax / metersPerPixel, HATCH_SIZE);
        const pattern = ctx.createPattern(hatchTile, "repeat");
        pattern.setTransform(new DOMMatrix().translate(offsetX, offsetY));

        ctx.fillStyle = pattern;
        ctx.fillRect(0, 0, bitmap.width, bitmap.height);
        ctx.globalCompositeOperation = "destination-in";
        ctx.drawImage(bitmap, 0, 0);
        const blob = await canvas.convertToBlob({ type: "image/png" });
        return { data: await blob.arrayBuffer() };
      });

      const FUEL_MODEL_URL = "fuelhatch://" + FUEL_MODEL_EXPORT_URL;

      // one const per layer -- keeping these standalone makes the draw order (the `layers`
      // array below) easy to see and rearrange without hunting through each definition
      const HILLSHADE_LAYER = {
        id: "hillshade",
        type: "hillshade",
        source: "hillshadeSource",
        layout: { visibility: "visible" },
        paint: { "hillshade-exaggeration": 0.3 },
      };

      // on by default -- toggled via the layer control
      const FUEL_MODELS_LAYER = {
        id: "fuel-models",
        type: "raster",
        source: "fuelModels",
        layout: { visibility: "visible" },
        // a hatch pattern already reads as sparse, unlike a solid fill, so this can sit
        // much closer to fully opaque
        paint: { "raster-opacity": 0.9 },
      };

      // on by default -- toggled via the layer control; this is USFS's own classification +
      // color ramp, so unlike the fuel-model hatch above it's a solid fill and needs to stay
      // translucent enough for roads/hillshade/labels underneath to stay legible
      const BURN_PROBABILITY_LAYER = {
        id: "burn-probability",
        type: "raster",
        source: "burnProbability",
        layout: { visibility: "visible" },
        paint: { "raster-opacity": 0.4 },
      };

      const WATER_LAYER = {
        id: "water",
        type: "fill",
        source: "roadsSource",
        "source-layer": "water",
        paint: {
          "fill-color": "#a3d3e8",
        },
      };

      const WATERWAYS_LAYER = {
        id: "waterways",
        type: "line",
        source: "roadsSource",
        "source-layer": "waterway",
        paint: {
          "line-color": "#a3d3e8",
          "line-width": ["interpolate", ["linear"], ["zoom"], 10, 0.5, 18, 2],
        },
      };

      // actual drivable road classes -- excluding this way (an allowlist) rather than just
      // excluding driveways/tracks/paths means rail/transit/tram/ferry/aerialway lines,
      // which the previous exclusion-only filter let through, don't render as "roads" too
      // https://openmaptiles.org/schema/#transportation
      const DRIVABLE_ROAD_CLASSES = [
        "motorway",
        "trunk",
        "primary",
        "secondary",
        "tertiary",
        "minor",
      ];

      const ROADS_LAYER = {
        id: "roads",
        type: "line",
        source: "roadsSource",
        "source-layer": "transportation",
        filter: ["in", ["get", "class"], ["literal", DRIVABLE_ROAD_CLASSES]],
        layout: { visibility: "visible" },
        paint: {
          "line-color": "#e58a1f",
          "line-width": ["interpolate", ["linear"], ["zoom"], 10, 0.5, 18, 4],
        },
      };

      // fed by live Overpass data (see updateOneway below), not roadsSource -- its "oneway"
      // field isn't reliable in this tileset
      const ONEWAY_ARROWS_LAYER = {
        id: "oneway-arrows",
        type: "symbol",
        source: "oneway",
        minzoom: 15,
        layout: {
          visibility: "visible",
          "icon-image": "oneway-arrow",
          "icon-size": 0.8,
          "symbol-placement": "line",
          "symbol-spacing": 80,
          "icon-rotation-alignment": "map",
          // a way digitized in reverse (oneway=-1) points the wrong way by default;
          // flip its arrow 180 degrees to still point the direction traffic actually flows
          "icon-rotate": ["match", ["get", "oneway"], -1, 180, 0],
          "icon-allow-overlap": true,
        },
      };

      // private roads/driveways (class "service") -- styled thinner + a different hue to
      // read as minor, same as OSM data allows
      // https://wiki.openstreetmap.org/wiki/Key:highway#Highway
      const DRIVEWAYS_LAYER = {
        id: "driveways",
        type: "line",
        source: "roadsSource",
        "source-layer": "transportation",
        filter: ["==", ["get", "class"], "service"],
        layout: { visibility: "visible" },
        paint: {
          "line-color": "#8855c8",
          "line-width": ["interpolate", ["linear"], ["zoom"], 10, 0.3, 18, 1.5],
        },
      };

      // unpaved tracks and foot/bike/horse paths (class "track", "path") --
      // https://wiki.openstreetmap.org/wiki/Tag:highway%3Dtrack
      // https://wiki.openstreetmap.org/wiki/Tag:highway%3Dpath
      const TRAILS_LAYER = {
        id: "trails",
        type: "line",
        source: "roadsSource",
        "source-layer": "transportation",
        filter: ["in", ["get", "class"], ["literal", ["track", "path"]]],
        layout: { visibility: "visible" },
        paint: {
          "line-color": "#6b8e23",
          "line-width": ["interpolate", ["linear"], ["zoom"], 10, 0.3, 18, 1.5],
          "line-dasharray": [2, 1.5],
        },
      };

      const ROAD_LABELS_LAYER = {
        id: "road-labels",
        type: "symbol",
        source: "roadsSource",
        "source-layer": "transportation_name",
        filter: ["in", ["get", "class"], ["literal", DRIVABLE_ROAD_CLASSES]],
        layout: {
          visibility: "visible",
          "text-field": ["get", "name"],
          "text-font": ["Noto Sans Bold"],
          "text-size": 12,
          "symbol-placement": "line",
        },
        paint: {
          "text-color": "#000000",
          "text-halo-color": "#ffffff",
          "text-halo-width": 1.5,
        },
      };

      const TRAIL_LABELS_LAYER = {
        id: "trail-labels",
        type: "symbol",
        source: "roadsSource",
        "source-layer": "transportation_name",
        filter: ["in", ["get", "class"], ["literal", ["track", "path"]]],
        layout: {
          visibility: "visible",
          "text-field": ["get", "name"],
          "text-font": ["Noto Sans Bold"],
          "text-size": 12,
          "symbol-placement": "line",
        },
        paint: {
          "text-color": "#000000",
          "text-halo-color": "#ffffff",
          "text-halo-width": 1.5,
        },
      };

      const WATER_LABELS_LAYER = {
        id: "water-labels",
        type: "symbol",
        source: "roadsSource",
        "source-layer": "water_name",
        layout: {
          "text-field": ["get", "name"],
          "text-font": ["Noto Sans Bold"],
          "text-size": 12,
        },
        paint: {
          "text-color": "#000000",
          "text-halo-color": "#ffffff",
          "text-halo-width": 1.5,
        },
      };

      const BUILDINGS_FILL_LAYER = {
        id: "buildings-fill",
        type: "fill",
        source: "buildings",
        "source-layer": SOURCE_LAYER,
        minzoom: BUILDING_MIN_ZOOM,
        layout: { visibility: "visible" },
        paint: {
          "fill-color": "#3fb1ce",
        },
      };

      const BUILDINGS_OUTLINE_LAYER = {
        id: "buildings-outline",
        type: "line",
        source: "buildings",
        "source-layer": SOURCE_LAYER,
        minzoom: BUILDING_MIN_ZOOM,
        layout: { visibility: "visible" },
        paint: {
          "line-color": "#1f7a8c",
          "line-width": 1,
        },
      };

      const HOUSENUMBERS_LAYER = {
        id: "housenumbers",
        type: "symbol",
        source: "roadsSource",
        "source-layer": "housenumber",
        minzoom: 16,
        layout: {
          visibility: "visible",
          "text-field": ["get", "housenumber"],
          "text-font": ["Noto Sans Bold"],
          "text-size": 12,
        },
        paint: {
          "text-color": "#000000",
          "text-halo-color": "#ffffff",
          "text-halo-width": 1,
        },
      };

      const HYDRANTS_LAYER = {
        id: "hydrants",
        type: "circle",
        source: "hydrants",
        minzoom: 13,
        layout: { visibility: "visible" },
        paint: {
          "circle-radius": ["interpolate", ["linear"], ["zoom"], 13, 2, 18, 6],
          "circle-color": "#e0342a",
          "circle-stroke-color": "#ffffff",
          "circle-stroke-width": 1,
        },
      };

      // fades out around where buildings/hydrants start showing (zoom 13), so the
      // two label sets hand off rather than fight for space
      const PLACE_LABELS_LAYER = {
        id: "place-labels",
        type: "symbol",
        source: "roadsSource",
        "source-layer": "place",
        maxzoom: 13,
        filter: [
          "in",
          ["get", "class"],
          ["literal", ["country", "city", "town"]],
        ],
        layout: {
          "text-field": ["get", "name"],
          "text-font": ["Noto Sans Bold"],
          "text-size": [
            "interpolate",
            ["linear"],
            ["zoom"],
            2,
            ["match", ["get", "class"], "country", 12, "city", 9, 8],
            10,
            ["match", ["get", "class"], "country", 18, "city", 15, 12],
          ],
        },
        paint: {
          "text-color": "#000000",
          "text-halo-color": "#ffffff",
          "text-halo-width": 1.5,
        },
      };

      const map = new maplibregl.Map({
        container: "map",
        // keeps #zoom/lat/lng in the URL in sync with the view, so a copied link reopens
        // to the same place
        hash: true,
        // default control collapses to an (i) icon that needs a click/hover to expand --
        // add our own always-expanded one instead, since attribution must show in print/exports
        attributionControl: false,
        style: {
          version: 8,
          sources: {
            // hillshade example: https://mapterhorn.com/examples/hillshade/
            hillshadeSource: {
              type: "raster-dem",
              tiles: ["https://tiles.mapterhorn.com/{z}/{x}/{y}.webp"],
              encoding: "terrarium",
              tileSize: 512,
              attribution:
                '&copy; <a href="https://mapterhorn.com" target="_blank">Mapterhorn</a>',
            },
            // OpenMapTiles-schema vector tiles, free & keyless: https://openfreemap.org
            roadsSource: {
              type: "vector",
              url: "https://tiles.openfreemap.org/planet",
            },
            buildings: {
              type: "vector",
              url: "pmtiles://" + PMTILES_URL,
            },
            // fire hydrants aren't in OpenFreeMap's POI set -- fetched live from OSM below
            hydrants: {
              type: "geojson",
              data: { type: "FeatureCollection", features: [] },
            },
            // OpenFreeMap's own "oneway" field is unreliable (nearly every road reports
            // oneway:1, real one-way streets are a small minority) -- fetched live from
            // OSM's real oneway tags below instead, same as hydrants
            oneway: {
              type: "geojson",
              data: { type: "FeatureCollection", features: [] },
            },
            // LANDFIRE (USGS/USFS, public domain); exportImage per-tile via the
            // {bbox-epsg-3857} template maplibre substitutes for ArcGIS image services
            fuelModels: {
              type: "raster",
              tiles: [FUEL_MODEL_URL],
              tileSize: 256,
              attribution:
                '<a href="https://landfire.gov" target="_blank">LANDFIRE</a>',
            },
            // USFS Wildfire Risk to Communities (public domain); exportImage per-tile via
            // the {bbox-epsg-3857} template maplibre substitutes for ArcGIS image services
            burnProbability: {
              type: "raster",
              tiles: [BURN_PROBABILITY_EXPORT_URL],
              tileSize: 256,
              attribution:
                '<a href="https://data-usfs.hub.arcgis.com/datasets/usfs::wildfire-risk-to-communities-burn-probability-image-service/about" target="_blank">USFS Wildfire Risk to Communities</a>',
            },
          },
          glyphs: "https://fonts.undpgeohub.org/fonts/{fontstack}/{range}.pbf",
          // draw order, bottom to top -- reorder these to change what draws over what
          layers: [
            HILLSHADE_LAYER,
            BURN_PROBABILITY_LAYER,
            FUEL_MODELS_LAYER,
            WATER_LAYER,
            WATERWAYS_LAYER,
            BUILDINGS_FILL_LAYER,
            TRAILS_LAYER,
            DRIVEWAYS_LAYER,
            ROADS_LAYER,
            ONEWAY_ARROWS_LAYER,
            WATER_LABELS_LAYER,
            BUILDINGS_OUTLINE_LAYER,
            ROAD_LABELS_LAYER,
            TRAIL_LABELS_LAYER,
            HOUSENUMBERS_LAYER,
            HYDRANTS_LAYER,
            PLACE_LABELS_LAYER,
          ],
        },
        center: CENTER,
        zoom: ZOOM,
      });

      // both hydrants and oneway streets are fetched live from OSM via Overpass rather than
      // from roadsSource (open data, no API key) -- for hydrants because OpenFreeMap's POI
      // set doesn't include them at all, for oneway because its "oneway" field turned out to
      // be unreliable (see DRIVABLE_ROAD_CLASSES above). Both follow the same shape: zoom-gate
      // by the layer's own minzoom, refetch (debounced) as the map moves, convert Overpass's
      // response into GeoJSON.
      const fetchOverpass = async (query) => {
        const response = await fetch(
          "https://overpass-api.de/api/interpreter",
          {
            method: "POST",
            body: "data=" + encodeURIComponent(query),
          },
        );
        return response.json();
      };

      const bindOverpassSource = ({
        sourceId,
        layerId,
        buildQuery,
        toFeatures,
        onLoading,
      }) => {
        const update = async () => {
          if (map.getZoom() < map.getLayer(layerId).minzoom) {
            map
              .getSource(sourceId)
              .setData({ type: "FeatureCollection", features: [] });
            return;
          }
          onLoading?.(true);
          try {
            const data = await fetchOverpass(buildQuery(map.getBounds()));
            const features = toFeatures(data.elements);
            map
              .getSource(sourceId)
              .setData({ type: "FeatureCollection", features });
          } catch (error) {
            console.error(`Failed to load ${sourceId} from Overpass:`, error);
          } finally {
            onLoading?.(false);
          }
        };
        let debounce;
        map.on("load", update);
        map.on("moveend", () => {
          clearTimeout(debounce);
          debounce = setTimeout(update, 500);
        });
      };

      const hydrantSpinner = document.getElementById("hydrant-spinner");
      bindOverpassSource({
        sourceId: "hydrants",
        layerId: "hydrants",
        buildQuery: (b) =>
          `[out:json][timeout:25];node["emergency"="fire_hydrant"](${b.getSouth()},${b.getWest()},${b.getNorth()},${b.getEast()});out;`,
        toFeatures: (elements) =>
          elements.map((el) => ({
            type: "Feature",
            geometry: { type: "Point", coordinates: [el.lon, el.lat] },
            properties: el.tags || {},
          })),
        onLoading: (loading) => {
          hydrantSpinner.hidden = !loading;
        },
      });

      map.on("load", () => map.addImage("oneway-arrow", makeArrowIcon()));

      bindOverpassSource({
        sourceId: "oneway",
        layerId: "oneway-arrows",
        buildQuery: (b) =>
          `[out:json][timeout:25];way["highway"]["oneway"~"^(yes|-1|1)$"](${b.getSouth()},${b.getWest()},${b.getNorth()},${b.getEast()});out geom;`,
        toFeatures: (elements) =>
          elements
            .filter((el) => el.geometry)
            .map((el) => ({
              type: "Feature",
              geometry: {
                type: "LineString",
                coordinates: el.geometry.map((pt) => [pt.lon, pt.lat]),
              },
              properties: { oneway: el.tags.oneway === "-1" ? -1 : 1 },
            })),
      });

      // zoom + compass share the default top-right group; only the zoom buttons get
      // hidden on paper (see print styles above), the compass survives printing since it
      // tracks the map's actual bearing and still points true north on a rotated map
      map.addControl(new maplibregl.NavigationControl());
      map.addControl(
        new maplibregl.GeolocateControl({
          positionOptions: { enableHighAccuracy: true },
        }),
      );
      map.addControl(new maplibregl.AttributionControl({ compact: false }));
      map.addControl(
        new maplibregl.ScaleControl({ maxWidth: 150, unit: "imperial" }),
        "bottom-left",
      );

      // geocodes via Nominatim (OSM's own search, open data, no API key)
      document
        .getElementById("place-search")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const query = document
            .getElementById("place-search-input")
            .value.trim();
          if (!query) return;
          try {
            const response = await fetch(
              "https://nominatim.openstreetmap.org/search?format=json&limit=1&q=" +
                encodeURIComponent(query),
            );
            const results = await response.json();
            if (results.length === 0) return;
            const { lon, lat, boundingbox } = results[0];
            if (boundingbox) {
              const [south, north, west, east] = boundingbox.map(Number);
              map.fitBounds(
                [
                  [west, south],
                  [east, north],
                ],
                { padding: 40, maxZoom: 17 },
              );
            } else {
              map.flyTo({ center: [Number(lon), Number(lat)], zoom: 16 });
            }
          } catch (error) {
            console.error("Place search failed:", error);
          }
        });

      // wires a checkbox to show/hide one or more layers together
      const bindLayerToggle = (checkboxId, layerIds) => {
        document.getElementById(checkboxId).addEventListener("change", (e) => {
          const visibility = e.target.checked ? "visible" : "none";
          for (const id of layerIds) {
            map.setLayoutProperty(id, "visibility", visibility);
          }
        });
      };
      bindLayerToggle("hillshade-toggle", ["hillshade"]);
      bindLayerToggle("fuel-model-toggle", ["fuel-models"]);
      bindLayerToggle("burn-probability-toggle", ["burn-probability"]);
      bindLayerToggle("buildings-toggle", [
        "buildings-fill",
        "buildings-outline",
        "housenumbers",
      ]);
      bindLayerToggle("roads-toggle", [
        "roads",
        "road-labels",
        "oneway-arrows",
      ]);
      bindLayerToggle("driveways-toggle", ["driveways"]);
      bindLayerToggle("trails-toggle", ["trails", "trail-labels"]);
      bindLayerToggle("hydrants-toggle", ["hydrants"]);

      // resize so the canvas redraws at full page size instead of printing blank/clipped
      window.addEventListener("beforeprint", () => map.resize());

      // caches this page, its scripts, and map tiles so a previously-viewed area still
      // works offline/on a bad connection -- see sw.js for what's cached and why
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker
          .register("sw.js")
          .catch((error) =>
            console.error("Service worker registration failed:", error),
          );
      }
    </script>
  </body>
</html>
