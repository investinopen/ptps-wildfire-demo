# GitHub Pages site -- see ../.github/workflows/publish-site.yml
# https://quarto.org/docs/websites/

# Never execute code during a site render; pages use the results saved in _freeze/ (for .qmd files) or in the notebooks themselves (.ipynb). Those come from the "Refresh notebooks" workflow (../.github/workflows/refresh-notebooks.yml), which renders each page on its own -- a single-file render always executes. Locally, `quarto preview` of a single file still executes it.
# https://quarto.org/docs/projects/code-execution.html#freeze
execute:
  freeze: true

project:
  type: website
  # everything else in this directory is a working notebook/script, not a page
  render:
    - index.qmd
    - rescue-status.qmd
    - risk.ipynb
    - fire_overlap.ipynb
  # published as-is
  resources:
    # has its own full-screen layout
    - firefighter-map/
    # the map links to the logo directly
    - img/

website:
  title: PtPS Wildfire Demo
  # both from https://investinopen.org/
  favicon: img/ioi-icon.png
  repo-url: https://github.com/investinopen/ptps-wildfire-demo
  repo-branch: main
  repo-subdir: analysis
  navbar:
    logo: img/ioi-logo-dark.svg
    logo-alt: Invest in Open Infrastructure
    left:
      - href: rescue-status.qmd
        text: Dataset rescue statuses
      - href: risk.ipynb
        text: Risk calculation
      - href: fire_overlap.ipynb
        text: Wildfire overlap
      - href: firefighter-map/index.html
        text: Firefighter map
  page-footer:
    left: "© 2026 [Invest in Open Infrastructure](https://investinopen.org/) · [MIT License](https://github.com/investinopen/ptps-wildfire-demo/blob/main/LICENSE)"
    right:
      - icon: github
        href: https://github.com/investinopen/ptps-wildfire-demo
        aria-label: GitHub

filters:
  - github-links.lua

format:
  html:
    theme:
      light: [cosmo, theme.scss]
      dark: [darkly, theme.scss]
    toc: true
    # code cells start collapsed, with their outputs still shown
    code-fold: true
