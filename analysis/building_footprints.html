<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Google/Microsoft/OSM open building footprints</title>
    <link
      href="https://cdn.jsdelivr.net/npm/maplibre-gl@5/dist/maplibre-gl.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5/dist/maplibre-gl.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pmtiles@4/dist/pmtiles.js"></script>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
      }
      #map {
        width: 100%;
        height: 100%;
      }

      @media print {
        @page {
          size: landscape;
          margin: 0.4in;
        }
        html,
        body,
        #map {
          height: 100vh;
          width: 100vw;
        }
        /* zoom/compass buttons are meaningless on paper; attribution stays, license requires it */
        .maplibregl-ctrl-top-right {
          display: none !important;
        }
      }

      #hydrant-spinner {
        position: absolute;
        top: 12px;
        left: 12px;
        width: 22px;
        height: 22px;
        border: 3px solid #ffffff;
        border-top-color: #e0342a;
        border-radius: 50%;
        box-shadow: 0 0 2px rgba(0, 0, 0, 0.4);
        animation: hydrant-spin 0.8s linear infinite;
        z-index: 1;
      }
      #hydrant-spinner[hidden] {
        display: none;
      }
      @keyframes hydrant-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <div id="hydrant-spinner" title="Loading fire hydrants…" hidden></div>
    <script>
      // Vector tile archive of merged Google V3 / Microsoft / OSM building footprints,
      // from https://beta.source.coop/repositories/vida/google-microsoft-osm-open-buildings/
      // Same source + view as:
      // https://pmtiles.io/#url=https://data.source.coop/vida/google-microsoft-osm-open-buildings/pmtiles/goog_msft_osm.pmtiles&map=16.03/40.052187/-105.375925
      const PMTILES_URL =
        "https://data.source.coop/vida/google-microsoft-osm-open-buildings/pmtiles/goog_msft_osm.pmtiles";
      const SOURCE_LAYER = "goog_msft_osm_building_footprints";
      const CENTER = [-105.375925, 40.052187]; // [lon, lat]
      const ZOOM = 16.03;

      const protocol = new pmtiles.Protocol();
      maplibregl.addProtocol("pmtiles", protocol.tile);

      const map = new maplibregl.Map({
        container: "map",
        // default control collapses to an (i) icon that needs a click/hover to expand --
        // add our own always-expanded one instead, since attribution must show in print/exports
        attributionControl: false,
        style: {
          version: 8,
          sources: {
            // hillshade example: https://mapterhorn.com/examples/hillshade/
            hillshadeSource: {
              type: "raster-dem",
              tiles: ["https://tiles.mapterhorn.com/{z}/{x}/{y}.webp"],
              encoding: "terrarium",
              tileSize: 512,
              attribution: "&copy; Mapterhorn",
            },
            // OpenMapTiles-schema vector tiles, free & keyless: https://openfreemap.org
            roadsSource: {
              type: "vector",
              url: "https://tiles.openfreemap.org/planet",
            },
            buildings: {
              type: "vector",
              url: "pmtiles://" + PMTILES_URL,
            },
            // fire hydrants aren't in OpenFreeMap's POI set -- fetched live from OSM below
            hydrants: {
              type: "geojson",
              data: { type: "FeatureCollection", features: [] },
            },
          },
          glyphs: "https://fonts.undpgeohub.org/fonts/{fontstack}/{range}.pbf",
          layers: [
            {
              id: "hillshade",
              type: "hillshade",
              source: "hillshadeSource",
              paint: { "hillshade-exaggeration": 0.3 },
            },
            {
              id: "water",
              type: "fill",
              source: "roadsSource",
              "source-layer": "water",
              paint: {
                "fill-color": "#a3d3e8",
              },
            },
            {
              id: "waterways",
              type: "line",
              source: "roadsSource",
              "source-layer": "waterway",
              paint: {
                "line-color": "#a3d3e8",
                "line-width": ["interpolate", ["linear"], ["zoom"], 10, 0.5, 18, 2],
              },
            },
            {
              // includes private roads/driveways (class "service", subclass "driveway") --
              // styled thinner + a different hue to read as minor, same as OSM data allows
              id: "roads",
              type: "line",
              source: "roadsSource",
              "source-layer": "transportation",
              paint: {
                "line-color": [
                  "match",
                  ["get", "class"],
                  ["service", "track", "path"],
                  "#8855c8",
                  "#e58a1f",
                ],
                "line-width": [
                  "interpolate",
                  ["linear"],
                  ["zoom"],
                  10,
                  [
                    "match",
                    ["get", "class"],
                    ["service", "track", "path"],
                    0.3,
                    0.5,
                  ],
                  18,
                  [
                    "match",
                    ["get", "class"],
                    ["service", "track", "path"],
                    1.5,
                    4,
                  ],
                ],
              },
            },
            {
              id: "road-labels",
              type: "symbol",
              source: "roadsSource",
              "source-layer": "transportation_name",
              layout: {
                "text-field": ["get", "name"],
                "text-font": ["Noto Sans Bold"],
                "text-size": 12,
                "symbol-placement": "line",
              },
              paint: {
                "text-color": "#5c3a00",
                "text-halo-color": "#ffffff",
                "text-halo-width": 1.5,
              },
            },
            {
              id: "water-labels",
              type: "symbol",
              source: "roadsSource",
              "source-layer": "water_name",
              layout: {
                "text-field": ["get", "name"],
                "text-font": ["Noto Sans Bold"],
                "text-size": 12,
              },
              paint: {
                "text-color": "#2f6a8c",
                "text-halo-color": "#ffffff",
                "text-halo-width": 1.5,
              },
            },
            {
              id: "buildings-fill",
              type: "fill",
              source: "buildings",
              "source-layer": SOURCE_LAYER,
              paint: {
                "fill-color": "#3fb1ce",
                "fill-opacity": 0.6,
              },
            },
            {
              id: "buildings-outline",
              type: "line",
              source: "buildings",
              "source-layer": SOURCE_LAYER,
              paint: {
                "line-color": "#1f7a8c",
                "line-width": 1,
              },
            },
            {
              id: "housenumbers",
              type: "symbol",
              source: "roadsSource",
              "source-layer": "housenumber",
              minzoom: 16,
              layout: {
                "text-field": ["get", "housenumber"],
                "text-font": ["Noto Sans Bold"],
                "text-size": 10,
              },
              paint: {
                "text-color": "#1f3d3a",
                "text-halo-color": "#ffffff",
                "text-halo-width": 1,
              },
            },
            {
              id: "hydrants",
              type: "circle",
              source: "hydrants",
              minzoom: 13,
              paint: {
                "circle-radius": ["interpolate", ["linear"], ["zoom"], 13, 2, 18, 6],
                "circle-color": "#e0342a",
                "circle-stroke-color": "#ffffff",
                "circle-stroke-width": 1,
              },
            },
          ],
        },
        center: CENTER,
        zoom: ZOOM,
      });

      // fire hydrants aren't part of OpenFreeMap's POI set, so fetch them directly from
      // OSM via Overpass for whatever's in view (open data, no API key), refetching as the
      // map moves -- debounced so a drag/zoom doesn't fire a request per frame
      const hydrantSpinner = document.getElementById("hydrant-spinner");

      async function updateHydrants() {
        if (map.getZoom() < map.getLayer("hydrants").minzoom) {
          map.getSource("hydrants").setData({ type: "FeatureCollection", features: [] });
          return;
        }
        const b = map.getBounds();
        const query = `[out:json][timeout:25];node["emergency"="fire_hydrant"](${b.getSouth()},${b.getWest()},${b.getNorth()},${b.getEast()});out;`;
        hydrantSpinner.hidden = false;
        try {
          const response = await fetch("https://overpass-api.de/api/interpreter", {
            method: "POST",
            body: "data=" + encodeURIComponent(query),
          });
          const data = await response.json();
          const features = data.elements.map((el) => ({
            type: "Feature",
            geometry: { type: "Point", coordinates: [el.lon, el.lat] },
            properties: el.tags || {},
          }));
          map.getSource("hydrants").setData({ type: "FeatureCollection", features });
        } catch (error) {
          console.error("Failed to load fire hydrants from Overpass:", error);
        } finally {
          hydrantSpinner.hidden = true;
        }
      }

      let hydrantDebounce;
      map.on("load", updateHydrants);
      map.on("moveend", () => {
        clearTimeout(hydrantDebounce);
        hydrantDebounce = setTimeout(updateHydrants, 500);
      });

      map.addControl(new maplibregl.NavigationControl());
      map.addControl(new maplibregl.AttributionControl({ compact: false }));

      // resize so the canvas redraws at full page size instead of printing blank/clipped
      window.addEventListener("beforeprint", () => map.resize());

      // click a building to see its properties, same as pmtiles.io's "Inspect features"
      map.on("click", "buildings-fill", (e) => {
        const props = e.features[0].properties;
        new maplibregl.Popup()
          .setLngLat(e.lngLat)
          .setHTML("<pre>" + JSON.stringify(props, null, 2) + "</pre>")
          .addTo(map);
      });
      map.on("mouseenter", "buildings-fill", () => {
        map.getCanvas().style.cursor = "pointer";
      });
      map.on("mouseleave", "buildings-fill", () => {
        map.getCanvas().style.cursor = "";
      });
    </script>
  </body>
</html>
