<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Google/Microsoft/OSM open building footprints</title>
    <link
      href="https://cdn.jsdelivr.net/npm/maplibre-gl@5/dist/maplibre-gl.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5/dist/maplibre-gl.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pmtiles@4/dist/pmtiles.js"></script>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
      }
      #map {
        width: 100%;
        height: 100%;
      }

      @media print {
        @page {
          size: landscape;
          margin: 0.4in;
        }
        html,
        body,
        #map {
          height: 100vh;
          width: 100vw;
        }
        /* zoom/compass buttons are meaningless on paper; attribution stays, license requires it */
        .maplibregl-ctrl-top-right {
          display: none !important;
        }
      }

      #hydrant-spinner {
        position: absolute;
        top: 12px;
        left: 12px;
        width: 22px;
        height: 22px;
        border: 3px solid #ffffff;
        border-top-color: #e0342a;
        border-radius: 50%;
        box-shadow: 0 0 2px rgba(0, 0, 0, 0.4);
        animation: hydrant-spin 0.8s linear infinite;
        z-index: 1;
      }
      #hydrant-spinner[hidden] {
        display: none;
      }
      @keyframes hydrant-spin {
        to {
          transform: rotate(360deg);
        }
      }

      #layer-controls {
        position: absolute;
        top: 12px;
        left: 44px;
        background: #ffffff;
        border-radius: 4px;
        box-shadow: 0 0 2px rgba(0, 0, 0, 0.4);
        padding: 6px 10px;
        font: 13px/1.4 sans-serif;
        z-index: 1;
      }
      #layer-controls label {
        display: flex;
        align-items: center;
        gap: 5px;
        white-space: nowrap;
      }
      #fuel-legend {
        position: absolute;
        bottom: 12px;
        left: 12px;
        background: #ffffff;
        border-radius: 4px;
        box-shadow: 0 0 2px rgba(0, 0, 0, 0.4);
        padding: 6px 10px;
        font: 12px/1.4 sans-serif;
        max-width: 280px;
        max-height: 280px;
        overflow-y: auto;
        z-index: 1;
      }
      #fuel-legend[hidden] {
        display: none;
      }
      #fuel-legend h4 {
        margin: 0 0 4px;
        font-size: 12px;
      }
      #fuel-legend .legend-item {
        display: flex;
        align-items: flex-start;
        gap: 5px;
        margin-bottom: 2px;
      }
      #fuel-legend .legend-item .swatch {
        width: 16px;
        height: 16px;
        margin-top: 1px;
        border: 1px solid rgba(0, 0, 0, 0.2);
        flex: none;
      }
      #fuel-legend .legend-item .swatch.hatch {
        background:
          repeating-linear-gradient(
            135deg,
            #d62828,
            #d62828 0.6px,
            transparent 0.6px,
            transparent 4px
          ),
          #ffffff;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <div id="hydrant-spinner" title="Loading fire hydrants…" hidden></div>
    <div id="layer-controls">
      <label>
        <input type="checkbox" id="fuel-model-toggle" />
        Medium/high fuel load (LANDFIRE)
      </label>
    </div>
    <div id="fuel-legend" hidden></div>
    <script>
      // Vector tile archive of merged Google V3 / Microsoft / OSM building footprints,
      // from https://beta.source.coop/repositories/vida/google-microsoft-osm-open-buildings/
      // Same source + view as:
      // https://pmtiles.io/#url=https://data.source.coop/vida/google-microsoft-osm-open-buildings/pmtiles/goog_msft_osm.pmtiles&map=16.03/40.052187/-105.375925
      const PMTILES_URL =
        "https://data.source.coop/vida/google-microsoft-osm-open-buildings/pmtiles/goog_msft_osm.pmtiles";
      const SOURCE_LAYER = "goog_msft_osm_building_footprints";
      const CENTER = [-105.375925, 40.052187]; // [lon, lat]
      const ZOOM = 16.03;
      const BUILDING_MIN_ZOOM = 14.5;
      // Scott & Burgan 40 fire behavior fuel models, from LANDFIRE (USGS/USFS, public domain)
      const FUEL_MODEL_SERVICE_URL =
        "https://edcintl.cr.usgs.gov/arcgis/rest/services/Landfire_LF2024/LF2024_FBFM40_CONUS/ImageServer";
      // the raster's underlying pixel values for each code (LANDFIRE's standard FBFM40
      // numbering: 9x nonburnable, 1xx grass, 12x grass-shrub, 14x shrub, 16x
      // timber-understory, 18x timber-litter, 20x slash-blowdown), spot-checked against
      // live /identify calls at a few points
      const FUEL_MODEL_VALUES = {
        NB1: 91,
        NB2: 92,
        NB3: 93,
        NB8: 98,
        NB9: 99,
        GR1: 101,
        GR2: 102,
        GR3: 103,
        GR4: 104,
        GR5: 105,
        GR6: 106,
        GR7: 107,
        GR8: 108,
        GS1: 121,
        GS2: 122,
        GS3: 123,
        GS4: 124,
        SH1: 141,
        SH2: 142,
        SH3: 143,
        SH4: 144,
        SH5: 145,
        SH6: 146,
        SH7: 147,
        SH8: 148,
        SH9: 149,
        TU1: 161,
        TU2: 162,
        TU3: 163,
        TU4: 164,
        TU5: 165,
        TL1: 181,
        TL2: 182,
        TL3: 183,
        TL4: 184,
        TL5: 185,
        TL6: 186,
        TL7: 187,
        TL8: 188,
        TL9: 189,
        SB1: 201,
        SB2: 202,
        SB3: 203,
        SB4: 204,
      };

      // fire spreads faster and burns more intensely with more fuel, so we use the load
      // LANDFIRE's own model names call out ("low"/"moderate"/"high"/"very high") as a
      // stand-in for risk -- nonburnable and low/sparse-load models are left out; a few
      // models with no load word in their name (TU4, TL4, TL7, TL8) are judgment calls
      // based on what they describe
      const MEDIUM_HIGH_RISK_CODES = [
        "GR4",
        "GR6",
        "GR7",
        "GR8",
        "GS2",
        "GS3",
        "GS4",
        "SH2",
        "SH3",
        "SH5",
        "SH7",
        "SH8",
        "SH9",
        "TU2",
        "TU3",
        "TU4",
        "TU5",
        "TL3",
        "TL5",
        "TL6",
        "TL7",
        "TL8",
        "TL9",
        "SB2",
        "SB3",
        "SB4",
      ];

      // every included code maps to the same opaque red -- we only need the colormap to
      // decide what's transparent (the mask below replaces the actual fill), so there's no
      // reason to carry a distinct color per fuel type anymore
      const FUEL_MODEL_COLORMAP = JSON.stringify({
        rasterFunction: "Colormap",
        rasterFunctionArguments: {
          colormap: MEDIUM_HIGH_RISK_CODES.map((code) => [
            FUEL_MODEL_VALUES[code],
            255,
            0,
            0,
          ]),
        },
      });

      const FUEL_MODEL_EXPORT_URL =
        FUEL_MODEL_SERVICE_URL +
        "/exportImage?bbox={bbox-epsg-3857}&bboxSR=3857&imageSR=3857&size=256,256&format=png32" +
        "&interpolation=RSP_NearestNeighbor&renderingRule=" +
        encodeURIComponent(FUEL_MODEL_COLORMAP) +
        "&f=image";

      // an 8px tile of thin diagonal lines, repeated to fill the risk mask below
      function makeHatchPattern() {
        const size = 8;
        const patternCanvas = new OffscreenCanvas(size, size);
        const pctx = patternCanvas.getContext("2d");
        pctx.strokeStyle = "#d62828";
        pctx.lineWidth = 0.6;
        for (const offset of [-size, 0, size]) {
          pctx.beginPath();
          pctx.moveTo(offset, size);
          pctx.lineTo(offset + size, 0);
          pctx.stroke();
        }
        return pctx.createPattern(patternCanvas, "repeat");
      }
      const hatchPattern = makeHatchPattern();

      const protocol = new pmtiles.Protocol();
      maplibregl.addProtocol("pmtiles", protocol.tile);

      // wraps the LANDFIRE tile fetch: keeps the colormap's opacity as a mask of where
      // medium/high risk fuels are, but swaps its fill for the diagonal hatch instead of a
      // solid color, since risk areas should read as "hazard" rather than "this color means
      // this fuel type" -- registered as a protocol the same way pmtiles:// is above
      maplibregl.addProtocol("fuelhatch", async (params) => {
        const response = await fetch(params.url.replace("fuelhatch://", ""));
        const bitmap = await createImageBitmap(await response.blob());
        const canvas = new OffscreenCanvas(bitmap.width, bitmap.height);
        const ctx = canvas.getContext("2d");
        ctx.fillStyle = hatchPattern;
        ctx.fillRect(0, 0, bitmap.width, bitmap.height);
        ctx.globalCompositeOperation = "destination-in";
        ctx.drawImage(bitmap, 0, 0);
        const blob = await canvas.convertToBlob({ type: "image/png" });
        return { data: await blob.arrayBuffer() };
      });

      const FUEL_MODEL_URL = "fuelhatch://" + FUEL_MODEL_EXPORT_URL;

      // one const per layer -- keeping these standalone makes the draw order (the `layers`
      // array below) easy to see and rearrange without hunting through each definition
      const HILLSHADE_LAYER = {
        id: "hillshade",
        type: "hillshade",
        source: "hillshadeSource",
        paint: { "hillshade-exaggeration": 0.3 },
      };

      // off by default -- toggled on via the layer control
      const FUEL_MODELS_LAYER = {
        id: "fuel-models",
        type: "raster",
        source: "fuelModels",
        layout: { visibility: "none" },
        // a hatch pattern already reads as sparse, unlike a solid fill, so this can sit
        // much closer to fully opaque
        paint: { "raster-opacity": 0.9 },
      };

      const WATER_LAYER = {
        id: "water",
        type: "fill",
        source: "roadsSource",
        "source-layer": "water",
        paint: {
          "fill-color": "#a3d3e8",
        },
      };

      const WATERWAYS_LAYER = {
        id: "waterways",
        type: "line",
        source: "roadsSource",
        "source-layer": "waterway",
        paint: {
          "line-color": "#a3d3e8",
          "line-width": ["interpolate", ["linear"], ["zoom"], 10, 0.5, 18, 2],
        },
      };

      // includes private roads/driveways (class "service", subclass "driveway") --
      // styled thinner + a different hue to read as minor, same as OSM data allows
      const ROADS_LAYER = {
        id: "roads",
        type: "line",
        source: "roadsSource",
        "source-layer": "transportation",
        paint: {
          "line-color": [
            "match",
            ["get", "class"],
            ["service", "track", "path"],
            "#8855c8",
            "#e58a1f",
          ],
          "line-width": [
            "interpolate",
            ["linear"],
            ["zoom"],
            10,
            ["match", ["get", "class"], ["service", "track", "path"], 0.3, 0.5],
            18,
            ["match", ["get", "class"], ["service", "track", "path"], 1.5, 4],
          ],
        },
      };

      const ROAD_LABELS_LAYER = {
        id: "road-labels",
        type: "symbol",
        source: "roadsSource",
        "source-layer": "transportation_name",
        layout: {
          "text-field": ["get", "name"],
          "text-font": ["Noto Sans Bold"],
          "text-size": 12,
          "symbol-placement": "line",
        },
        paint: {
          "text-color": "#5c3a00",
          "text-halo-color": "#ffffff",
          "text-halo-width": 1.5,
        },
      };

      const WATER_LABELS_LAYER = {
        id: "water-labels",
        type: "symbol",
        source: "roadsSource",
        "source-layer": "water_name",
        layout: {
          "text-field": ["get", "name"],
          "text-font": ["Noto Sans Bold"],
          "text-size": 12,
        },
        paint: {
          "text-color": "#2f6a8c",
          "text-halo-color": "#ffffff",
          "text-halo-width": 1.5,
        },
      };

      const BUILDINGS_FILL_LAYER = {
        id: "buildings-fill",
        type: "fill",
        source: "buildings",
        "source-layer": SOURCE_LAYER,
        minzoom: BUILDING_MIN_ZOOM,
        paint: {
          "fill-color": "#3fb1ce",
        },
      };

      const BUILDINGS_OUTLINE_LAYER = {
        id: "buildings-outline",
        type: "line",
        source: "buildings",
        "source-layer": SOURCE_LAYER,
        minzoom: BUILDING_MIN_ZOOM,
        paint: {
          "line-color": "#1f7a8c",
          "line-width": 1,
        },
      };

      const HOUSENUMBERS_LAYER = {
        id: "housenumbers",
        type: "symbol",
        source: "roadsSource",
        "source-layer": "housenumber",
        minzoom: 16,
        layout: {
          "text-field": ["get", "housenumber"],
          "text-font": ["Noto Sans Bold"],
          "text-size": 10,
        },
        paint: {
          "text-color": "#1f3d3a",
          "text-halo-color": "#ffffff",
          "text-halo-width": 1,
        },
      };

      const HYDRANTS_LAYER = {
        id: "hydrants",
        type: "circle",
        source: "hydrants",
        minzoom: 13,
        paint: {
          "circle-radius": ["interpolate", ["linear"], ["zoom"], 13, 2, 18, 6],
          "circle-color": "#e0342a",
          "circle-stroke-color": "#ffffff",
          "circle-stroke-width": 1,
        },
      };

      // fades out around where buildings/hydrants start showing (zoom 13), so the
      // two label sets hand off rather than fight for space
      const PLACE_LABELS_LAYER = {
        id: "place-labels",
        type: "symbol",
        source: "roadsSource",
        "source-layer": "place",
        maxzoom: 13,
        filter: [
          "in",
          ["get", "class"],
          ["literal", ["country", "city", "town"]],
        ],
        layout: {
          "text-field": ["get", "name"],
          "text-font": ["Noto Sans Bold"],
          "text-size": [
            "interpolate",
            ["linear"],
            ["zoom"],
            2,
            ["match", ["get", "class"], "country", 12, "city", 9, 8],
            10,
            ["match", ["get", "class"], "country", 18, "city", 15, 12],
          ],
        },
        paint: {
          "text-color": "#2b2b2b",
          "text-halo-color": "#ffffff",
          "text-halo-width": 1.5,
        },
      };

      const map = new maplibregl.Map({
        container: "map",
        // keeps #zoom/lat/lng in the URL in sync with the view, so a copied link reopens
        // to the same place
        hash: true,
        // default control collapses to an (i) icon that needs a click/hover to expand --
        // add our own always-expanded one instead, since attribution must show in print/exports
        attributionControl: false,
        style: {
          version: 8,
          sources: {
            // hillshade example: https://mapterhorn.com/examples/hillshade/
            hillshadeSource: {
              type: "raster-dem",
              tiles: ["https://tiles.mapterhorn.com/{z}/{x}/{y}.webp"],
              encoding: "terrarium",
              tileSize: 512,
              attribution: "&copy; Mapterhorn",
            },
            // OpenMapTiles-schema vector tiles, free & keyless: https://openfreemap.org
            roadsSource: {
              type: "vector",
              url: "https://tiles.openfreemap.org/planet",
            },
            buildings: {
              type: "vector",
              url: "pmtiles://" + PMTILES_URL,
            },
            // fire hydrants aren't in OpenFreeMap's POI set -- fetched live from OSM below
            hydrants: {
              type: "geojson",
              data: { type: "FeatureCollection", features: [] },
            },
            // LANDFIRE (USGS/USFS, public domain); exportImage per-tile via the
            // {bbox-epsg-3857} template maplibre substitutes for ArcGIS image services
            fuelModels: {
              type: "raster",
              tiles: [FUEL_MODEL_URL],
              tileSize: 256,
              attribution: "LANDFIRE",
            },
          },
          glyphs: "https://fonts.undpgeohub.org/fonts/{fontstack}/{range}.pbf",
          // draw order, bottom to top -- reorder these to change what draws over what
          layers: [
            HILLSHADE_LAYER,
            FUEL_MODELS_LAYER,
            WATER_LAYER,
            WATERWAYS_LAYER,
            BUILDINGS_FILL_LAYER,
            ROADS_LAYER,
            WATER_LABELS_LAYER,
            BUILDINGS_OUTLINE_LAYER,
            ROAD_LABELS_LAYER,
            HOUSENUMBERS_LAYER,
            HYDRANTS_LAYER,
            PLACE_LABELS_LAYER,
          ],
        },
        center: CENTER,
        zoom: ZOOM,
      });

      // fire hydrants aren't part of OpenFreeMap's POI set, so fetch them directly from
      // OSM via Overpass for whatever's in view (open data, no API key), refetching as the
      // map moves -- debounced so a drag/zoom doesn't fire a request per frame
      const hydrantSpinner = document.getElementById("hydrant-spinner");

      async function updateHydrants() {
        if (map.getZoom() < map.getLayer("hydrants").minzoom) {
          map
            .getSource("hydrants")
            .setData({ type: "FeatureCollection", features: [] });
          return;
        }
        const b = map.getBounds();
        const query = `[out:json][timeout:25];node["emergency"="fire_hydrant"](${b.getSouth()},${b.getWest()},${b.getNorth()},${b.getEast()});out;`;
        hydrantSpinner.hidden = false;
        try {
          const response = await fetch(
            "https://overpass-api.de/api/interpreter",
            {
              method: "POST",
              body: "data=" + encodeURIComponent(query),
            },
          );
          const data = await response.json();
          const features = data.elements.map((el) => ({
            type: "Feature",
            geometry: { type: "Point", coordinates: [el.lon, el.lat] },
            properties: el.tags || {},
          }));
          map
            .getSource("hydrants")
            .setData({ type: "FeatureCollection", features });
        } catch (error) {
          console.error("Failed to load fire hydrants from Overpass:", error);
        } finally {
          hydrantSpinner.hidden = true;
        }
      }

      let hydrantDebounce;
      map.on("load", updateHydrants);
      map.on("moveend", () => {
        clearTimeout(hydrantDebounce);
        hydrantDebounce = setTimeout(updateHydrants, 500);
      });

      map.addControl(new maplibregl.NavigationControl());
      map.addControl(new maplibregl.AttributionControl({ compact: false }));

      const fuelLegend = document.getElementById("fuel-legend");

      function buildFuelLegend() {
        fuelLegend.innerHTML =
          "<h4>Fuel risk (LANDFIRE)</h4>" +
          '<div class="legend-item"><span class="swatch hatch"></span>' +
          "<span>Medium/high fuel load</span></div>";
      }

      document
        .getElementById("fuel-model-toggle")
        .addEventListener("change", (e) => {
          const visible = e.target.checked;
          map.setLayoutProperty(
            "fuel-models",
            "visibility",
            visible ? "visible" : "none",
          );
          fuelLegend.hidden = !visible;
          if (visible) buildFuelLegend();
        });

      // resize so the canvas redraws at full page size instead of printing blank/clipped
      window.addEventListener("beforeprint", () => map.resize());

      // click a building to see its properties, same as pmtiles.io's "Inspect features"
      map.on("click", "buildings-fill", (e) => {
        const props = e.features[0].properties;
        new maplibregl.Popup()
          .setLngLat(e.lngLat)
          .setHTML("<pre>" + JSON.stringify(props, null, 2) + "</pre>")
          .addTo(map);
      });
      map.on("mouseenter", "buildings-fill", () => {
        map.getCanvas().style.cursor = "pointer";
      });
      map.on("mouseleave", "buildings-fill", () => {
        map.getCanvas().style.cursor = "";
      });
    </script>
  </body>
</html>
