<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Google/Microsoft/OSM open building footprints</title>
    <link
      href="https://cdn.jsdelivr.net/npm/maplibre-gl@5/dist/maplibre-gl.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5/dist/maplibre-gl.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pmtiles@4/dist/pmtiles.js"></script>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
      }
      #map {
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <script>
      // Vector tile archive of merged Google V3 / Microsoft / OSM building footprints,
      // from https://beta.source.coop/repositories/vida/google-microsoft-osm-open-buildings/
      // Same source + view as:
      // https://pmtiles.io/#url=https://data.source.coop/vida/google-microsoft-osm-open-buildings/pmtiles/goog_msft_osm.pmtiles&map=16.03/40.052187/-105.375925
      const PMTILES_URL =
        "https://data.source.coop/vida/google-microsoft-osm-open-buildings/pmtiles/goog_msft_osm.pmtiles";
      const SOURCE_LAYER = "goog_msft_osm_building_footprints";
      const CENTER = [-105.375925, 40.052187]; // [lon, lat]
      const ZOOM = 16.03;

      const protocol = new pmtiles.Protocol();
      maplibregl.addProtocol("pmtiles", protocol.tile);

      const map = new maplibregl.Map({
        container: "map",
        style: {
          version: 8,
          sources: {
            basemap: {
              type: "raster",
              tiles: ["https://tile.opentopomap.org/{z}/{x}/{y}.png"],
              tileSize: 256,
              attribution:
                "&copy; OpenStreetMap contributors, SRTM | map style: &copy; OpenTopoMap (CC-BY-SA)",
            },
            buildings: {
              type: "vector",
              url: "pmtiles://" + PMTILES_URL,
            },
          },
          layers: [
            { id: "basemap", type: "raster", source: "basemap" },
            {
              id: "buildings-fill",
              type: "fill",
              source: "buildings",
              "source-layer": SOURCE_LAYER,
              paint: {
                "fill-color": "#3fb1ce",
                "fill-opacity": 0.6,
              },
            },
            {
              id: "buildings-outline",
              type: "line",
              source: "buildings",
              "source-layer": SOURCE_LAYER,
              paint: {
                "line-color": "#1f7a8c",
                "line-width": 1,
              },
            },
          ],
        },
        center: CENTER,
        zoom: ZOOM,
      });

      map.addControl(new maplibregl.NavigationControl());

      // click a building to see its properties, same as pmtiles.io's "Inspect features"
      map.on("click", "buildings-fill", (e) => {
        const props = e.features[0].properties;
        new maplibregl.Popup()
          .setLngLat(e.lngLat)
          .setHTML("<pre>" + JSON.stringify(props, null, 2) + "</pre>")
          .addTo(map);
      });
      map.on("mouseenter", "buildings-fill", () => {
        map.getCanvas().style.cursor = "pointer";
      });
      map.on("mouseleave", "buildings-fill", () => {
        map.getCanvas().style.cursor = "";
      });
    </script>
  </body>
</html>
