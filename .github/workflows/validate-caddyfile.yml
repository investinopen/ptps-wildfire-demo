name: Validate Caddyfile

on:
  push:
    paths:
      - "proxy/Caddyfile"
      - ".github/workflows/validate-caddyfile.yml"
  pull_request:
    paths:
      - "proxy/Caddyfile"
      - ".github/workflows/validate-caddyfile.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Caddyfile
        uses: docker://caddy:2-alpine
        with:
          entrypoint: caddy
          args: validate --config /github/workspace/proxy/Caddyfile
