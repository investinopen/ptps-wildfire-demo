name: Publish Pages site

on:
  push:
    branches:
      - main
    paths:
      - analysis/**
      - ptps_wildfire_demo/**
      - .github/workflows/publish-site.yml
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: latest
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --locked

      # https://quarto.org/docs/publishing/github-pages.html#github-action
      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      # generates the report (rescue-status.qmd); notebooks are rendered from their committed
      # outputs, not re-executed
      - name: Render site
        run: uv run quarto render analysis

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: analysis/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
