name: Publish Pages site

# Renders the site without executing any code: the pages that run against live data are executed by refresh-notebooks.yml, and the detailed firefighter map's water and road-access tiles are built by build-access-tiles.yml, with each pulled in from its latest successful run. So publishing doesn't depend on any outside data source being up.

on:
  push:
    branches:
      - main
    paths:
      - site/**
      - ptps_wildfire_demo/**
      - .github/workflows/publish-site.yml
  # picks up freshly executed pages and tiles
  workflow_run:
    workflows:
      - Refresh notebooks
      - Build access tiles
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  # to download the refresh workflow's artifact
  actions: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # a failed refresh leaves nothing new to publish
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Find the latest refreshed pages
        id: refresh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow refresh-notebooks.yml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          echo "run-id=$run_id" >> "$GITHUB_OUTPUT"

      # Overwrites the checked-out notebooks with their executed versions, and adds _freeze/ for the .qmd. A notebook edited since that refresh shows its old version until the refresh that the edit triggers finishes (which then republishes).
      - name: Download refreshed pages
        if: steps.refresh.outputs.run-id != ''
        uses: actions/download-artifact@v8
        with:
          name: executed-pages
          path: site
          run-id: ${{ steps.refresh.outputs.run-id }}
          github-token: ${{ github.token }}

      # The newest tiles built on main. By artifact rather than by the latest successful run, since a run that found nothing new to build (see its check job) succeeds without making any. Unlike the pages, the map has no fallback without these, so publishing stops rather than deploying it broken. The artifacts last 90 days, far longer than Geofabrik goes without updating the extract.
      - name: Find the latest access tiles
        id: tiles
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=access-tiles&per_page=100" --jq '[.artifacts[] | select((.expired | not) and .workflow_run.head_branch == "main")] | sort_by(.created_at) | last | .workflow_run.id // empty')
          if [ -z "$run_id" ]; then
            echo "::error::No unexpired access-tiles artifact from build-access-tiles.yml on main to take the detailed map's tiles from"
            exit 1
          fi
          echo "run-id=$run_id" >> "$GITHUB_OUTPUT"

      # published along with the rest of the detailed map's folder (see site/_quarto.yml)
      - name: Download access tiles
        uses: actions/download-artifact@v8
        with:
          name: access-tiles
          path: site/firefighter-maps/detailed
          run-id: ${{ steps.tiles.outputs.run-id }}
          github-token: ${{ github.token }}

      # Overture only keeps each release's tiles for about two months, so the detailed map is pointed at the latest one (see overture.js). If Overture's catalog is down, the release already in the file is kept.
      - name: Use the latest Overture release
        run: |
          if release=$(curl -fsS --max-time 30 https://stac.overturemaps.org/catalog.json | jq -er .latest); then
            sed -i "s|^export const OVERTURE_RELEASE = .*|export const OVERTURE_RELEASE = \"$release\";|" site/firefighter-maps/detailed/scripts/overture.js
            grep -F "OVERTURE_RELEASE = \"$release\"" site/firefighter-maps/detailed/scripts/overture.js
          else
            echo "::warning::Couldn't get the latest Overture release, so the detailed map keeps the one in overture.js"
          fi

      # Python is only needed if there's no refreshed copy of a .qmd page (e.g. its artifact expired), in which case the render executes it after all
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: latest
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --locked

      # https://quarto.org/docs/publishing/github-pages.html#github-action
      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      # no --execute: with `freeze: true` (see site/_quarto.yml), pages use their saved results
      - name: Render site
        run: uv run quarto render site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
