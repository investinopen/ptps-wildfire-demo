name: Publish Pages site

# Renders the site without executing any code: the pages that run against live data are executed by refresh-notebooks.yml, and their results are pulled in from its latest successful run. So publishing doesn't depend on any outside data source being up.

on:
  push:
    branches:
      - main
    paths:
      - analysis/**
      - ptps_wildfire_demo/**
      - .github/workflows/publish-site.yml
  # picks up freshly executed pages
  workflow_run:
    workflows:
      - Refresh notebooks
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  # to download the refresh workflow's artifact
  actions: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # a failed refresh leaves nothing new to publish
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Find the latest refreshed pages
        id: refresh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow refresh-notebooks.yml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          echo "run-id=$run_id" >> "$GITHUB_OUTPUT"

      # Overwrites the checked-out notebooks with their executed versions, and adds _freeze/ for the .qmd. A notebook edited since that refresh shows its old version until the refresh that the edit triggers finishes (which then republishes).
      - name: Download refreshed pages
        if: steps.refresh.outputs.run-id != ''
        uses: actions/download-artifact@v8
        with:
          name: executed-pages
          path: analysis
          run-id: ${{ steps.refresh.outputs.run-id }}
          github-token: ${{ github.token }}

      # Python is only needed if there's no refreshed copy of a .qmd page (e.g. its artifact expired), in which case the render executes it after all
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: latest
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --locked

      # https://quarto.org/docs/publishing/github-pages.html#github-action
      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      # no --execute: with `freeze: true` (see analysis/_quarto.yml), pages use their saved results
      - name: Render site
        run: uv run quarto render analysis

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: analysis/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
